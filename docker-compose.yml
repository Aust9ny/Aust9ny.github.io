services:
  # Portfolio Web App (Express + React 19 + API)
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://postgres:devops_secret_pass@postgres:5432/portfoliodb
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - portfolio_data:/app/data

  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devops_secret_pass
      POSTGRES_DB: portfoliodb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfoliodb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  portfolio_data:
  pg_data:
